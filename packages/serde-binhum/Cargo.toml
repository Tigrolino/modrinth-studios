[package]
name = "serde-binhum"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
proc-macro = true
# The README examples are documentation only. On Windows the workspace links
# with rust-lld (.cargo/config.toml), which rustdoc's doctest binaries can't
# link against the MSVC runtime with, so they'd always fail there.
doctest = false

[dependencies]
darling = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features = ["full"] }

[lints]
workspace = true
